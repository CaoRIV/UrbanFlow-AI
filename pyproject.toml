[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanflow-ai"
version = "0.1.0"
description = "Historical backtest for next-hour NYC Yellow Taxi pickup forecasts"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb==1.5.5",
    "pyarrow==23.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
