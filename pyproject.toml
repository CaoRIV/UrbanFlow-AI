[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanflow-ai"
version = "0.1.0"
description = "Historical backtest for next-hour NYC Yellow Taxi pickup forecasts"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb==1.5.5",
    "fastapi==0.141.1",
    "numpy==2.4.6",
    "psutil==7.2.2",
    "pyarrow==23.0.1",
    "scipy==1.17.1",
    "tzdata==2026.4",
    "uvicorn==0.53.0",
    "xgboost==3.2.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
